    <script>
      (function () {
        try {
          var saved = localStorage.getItem('deco_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var palette = localStorage.getItem('deco_palette');
          if (palette && ['teal', 'indigo', 'copper', 'crimson'].indexOf(palette) !== -1) {
            document.documentElement.dataset.palette = palette;
          } else {
            document.documentElement.dataset.palette = 'teal';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased selection:bg-[var(--accent-soft)]">
